[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubeadcs"
version = "0.1.0"
description = "Validated CubeSat ADCS simulator: B-dot detumbling, reaction-wheel pointing, MEKF, Monte Carlo."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tommaso Maggiolo" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
keywords = ["cubesat", "adcs", "attitude-control", "kalman-filter", "mekf", "spacecraft"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
igrf = ["ppigrf>=2.0"]
dev = ["pytest>=7", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
